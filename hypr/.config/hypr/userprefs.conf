# See https://wiki.hyprland.org/Configuring/Window-Rules/
windowrule = opacity 0.90 0.70 0.95,class:^(kitty)$
windowrule = opacity 0.90 0.90,title:(Discord)
windowrule = opacity 1 1, title:(Brave)
windowrule = opacity 0.90 0.70,initialTitle:^(Spotify Premium)$
windowrule = opacity 0.90 0.90 0.9,class:(com.github.johnfactotum.Foliate)
windowrule = float,center,size 500 500,class:(xdg-desktop-portal-gtk)

workspace = 1, on-created-empty:$browser

workspace = special:Apps, gapsin:8, gapsout:20, on-created-empty:vesktop
workspace = special:Music, gapsin:8, gapsout:20, on-created-empty:spotify
workspace = special:scratchpad, gapsin:20, gapsout:35 
