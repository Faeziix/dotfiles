# Set your personal hyprland configuration here
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/userprefs.t2

exec-once = pipewire & pipewire-pulse & wireplumber # start pipewire
exec-once = mpris-proxy # start mpris proxy for media keys
exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6

env = FREETYPE_PROPERTIES,cff:no-stem-darkening=0 autofitter:no-stem-darkening=0
env = FONTCONFIG_PATH,/etc/fonts
env = FONTCONFIG_FILE,/etc/fonts/fonts.conf
env = XDG_MENU_PREFIX,arch-

input {
  kb_layout = us,ir
  repeat_delay = 250
  repeat_rate = 70
  scroll_factor = 0.8
}

general {
  layout = master
}

general {
    gaps_in = 8
    gaps_out = 14
    resize_on_border = true
}

decoration {
  rounding = 12
  blur {
    enabled = yes
      size = 3
      passes = 3
      new_optimizations = on
      ignore_opacity = on
      xray = true
  }
}

master {
  new_on_top = true
}

misc {
  initial_workspace_tracking = 0
}

animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.01
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 2, wind, slide
    animation = windowsIn, 1, 2, wind, slide
    animation = windowsOut, 1, 2, wind, slide
    animation = windowsMove, 1, 2, wind, slide animation = border, 1, 1, liner animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 2, wind, slidefade 15%
    animation = specialWorkspaceIn, 1, 2, wind, slidefadevert 10%
    animation = specialWorkspaceOut, 1, 2, wind, slidefade 10%
}

# █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄ █ █▄░█ █▀▀ █▀
# █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀ █ █░▀█ █▄█ ▄█

$browser = zen-browser

unbind = ,F12
unbind = ,F11
unbind = ,F10
unbind = ,F9
unbind = ,F8
unbind = ,F7
unbind = ALT,Return

unbind = $mainMod, W
bind = $mainMod, W, exec, $browser # launch web browser

unbind = $mainMod, SPACE
bind = $mainMod, SPACE, layoutmsg, swapwithmaster child # swap the window on focus with the next window
bind = $mainMod, SPACE, movewindow, u
bind = $mainMod, SPACE, movewindow, u
bind = $mainMod, SPACE, movewindow, u
bind = $mainMod, SPACE, movewindow, u
bind = $mainMod, SPACE, movewindow, u
bind = $mainMod, SPACE, layoutmsg, focusmaster master

unbind = $mainMod, F
bind = $mainMod, F, fullscreenstate, 2 # toggle the window on focus to fullscreen
unbind = $mainMod SHIFT, F
bind = $mainMod SHIFT, F, fullscreenstate, 1 # toggle the window on focus to fullscreen
unbind = $mainMod ALT, F
bind = $mainMod ALT, F, fullscreen, 0
unbind = $mainMod SHIFT, SPACE
bind = $mainMod SHIFT, SPACE, togglefloating, # toggle the window between focus and float
unbind=$mainMod, O
bind = $mainMod, O, layoutmsg, addmaster
unbind=$mainMod SHIFT, O
bind = $mainMod SHIFT, O, layoutmsg, removemaster
unbind = $mainMod, U
bind = $mainMod, U, exec, $scrPath/layout_switcher.sh

# Move focus with mainMod + JK
unbind = $mainMod, J
unbind = $mainMod, K
bind = $mainMod, J, layoutmsg, cyclenext
bind = $mainMod, K, layoutmsg, cycleprev

unbind = $mainMod, return
bind = $mainMod, return, exec,[group barred] $term  # open terminal
unbind = $mainMod ALT, return
bind = $mainMod ALT, return, exec,[group set] $term  # open terminal floating

unbind = $mainMod, B
bind = $mainMod, B, exec, killall waybar || waybar # toggle waybar
unbind = $mainMod+Alt, L
bind = $mainMod+Alt, L, exec, $scrPath/keyboardswitch.sh # switch keyboard layout
unbind = $mainMod, F10, exec, ~/.config/hypr/scripts/mouse_toggle.sh
bind = $mainMod, F10, exec, ~/.config/hypr/scripts/mouse_toggle.sh
unbind = $mainMod, I, layoutmsg, orientationcenter
bind = $mainMod, I, layoutmsg, orientationcenter
unbind = $mainMod, T, layoutmsg, orientationleft
bind = $mainMod, T, layoutmsg, orientationleft
unbind = $mainMod, F1, exec, [float;center;xray 1;size 800 600] $term -e pulsemixer # open pulsemixer
bind = $mainMod, F1, exec, [float;center;xray 1;size 800 600] $term -e pulsemixer # open pulsemixer
unbind = $mainMod, F2, exec, guvcview # open webcam viewer
bind = $mainMod, F2, exec, guvcview # open webcam viewer
unbind = $mainMod SHIFT, B, exec, blueman-manager # open bluetooth manager
bind = $mainMod SHIFT, B, exec, blueman-manager # open bluetooth manager
unbind = $mainMod, F12, exec, xournalpp ~/Work/german/B1/starten\ wir\ b1\ studentbook.xopp
bind = $mainMod, F12, exec, xournalpp ~/Work/german/B1/starten\ wir\ b1\ studentbook.xopp
unbind = $mainMod ALT, P
bind = $mainMod ALT, P, pin
unbind = $mainMod+Alt, N
bind = $mainMod+Alt, N, exec, $term -e nvim ~/orgfiles/refile.org # open refile.org
unbind = $mainMod, N, exec, $term -e nvim -c VimwikiIndex -c "cd ~/vimwiki/" # open vimwiki
bind = $mainMod, N, exec, $term -e nvim -c VimwikiIndex -c "cd ~/vimwiki/" # open vimwiki
unbind = $mainMod SHIFT, G
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/scripts/gamelauncher.sh 4 # steam game launcher
unbind = $mainMod ALT, R
bind = $mainMod ALT, R, exec, $term -e btop # open btop
bind = $mainMod SHIFT, S, exec, spotify
bind = $mainMod, Backspace, movecursor, 960 850
bind = $mainMod ALT, T, exec, [float;center 1;size 600 400] $term -e nvim -c "VimwikiIndex" -c "VimwikiGoto Todo"

unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
binde = , XF86MonBrightnessUp, exec, $scrPath/monitor_brightness.sh 100
binde = , XF86MonBrightnessDown, exec, $scrPath/monitor_brightness.sh 20
# Audio control
unbind  = $mainMod, EQUAL, exec, $scrPath/volumecontrol.sh -o i # increase volume
binde  = $mainMod, EQUAL, exec, $scrPath/volumecontrol.sh -o i # increase volume
unbind  = $mainMod, MINUS, exec, $scrPath/volumecontrol.sh -o d # decrease volume
binde  = $mainMod, MINUS, exec, $scrPath/volumecontrol.sh -o d # decrease volume
unbind  = $mainMod, P, exec, playerctl --player=spotify play-pause
bind  = $mainMod, P, exec, playerctl --player=spotify play-pause
unbind  = $mainMod, BRACKETRIGHT, exec, playerctl --player=spotify next
bind  = $mainMod, BRACKETRIGHT, exec, playerctl --player=spotify next
unbind  = $mainMod, BRACKETLEFT, exec, playerctl --player=spotify previous
bind  = $mainMod, BRACKETLEFT, exec, playerctl --player=spotify previous
unbind  = $mainMod, PERIOD, exec, playerctl position 5+
binde  = $mainMod, PERIOD, exec, playerctl position 5+
unbind  = $mainMod, COMMA, exec, playerctl position 5-
binde  = $mainMod, COMMA, exec, playerctl position 5-

unbind = $mainMod ALT, G, togglegroup,
bind = $mainMod ALT, G, togglegroup,
unbind = $mainMod SHIFT, N, changegroupactive, forward
bind = $mainMod SHIFT, N, changegroupactive, forward

# Rofi menu
unbind = $mainMod, D
bind = $mainMod, D, exec, pkill -x rofi || $scrPath/rofilaunch.sh d # launch application launcher

# Trigger when the switch is turning off
unbind= , switch:on:Lid Switch, exec, swaylock && loginctl suspend
bindl= , switch:on:Lid Switch, exec, swaylock && loginctl suspend


# Switch workspaces relative to the active workspace with mainMod + G/; (semicolon)
unbind = $mainMod, SEMICOLON, workspace, e+1
bind = $mainMod, SEMICOLON, workspace, e+1
unbind = $mainMod, APOSTROPHE, exec, [float;center 1;size 600 400] $term -e bc -lq ~/.config/bc/calc.b
bind = $mainMod, APOSTROPHE, exec, [float;center 1;size 600 400] $term -e bc -lq ~/.config/bc/calc.b
unbind = $mainMod SHIFT, APOSTROPHE, exec, [float;center 1;size 600 400] kalk
bind = $mainMod SHIFT, APOSTROPHE, exec, [float;center 1;size 600 400] kalk
unbind = $mainMod SHIFT, H, centerwindow, 1
bind = $mainMod SHIFT, H, centerwindow, 1
unbind = $mainMod, G, workspace, e-1
bind = $mainMod, G, workspace, e-1

# Resize windows
unbind = $mainMod, L, resizeactive, 40 0
binde = $mainMod, L, resizeactive, 40 0
unbind = $mainMod, H, resizeactive, -40 0
binde = $mainMod, H, resizeactive, -40 0
unbind = $mainMod SHIFT, K, resizeactive, 0 -40
binde = $mainMod SHIFT, K, resizeactive, 0 -40
unbind = $mainMod SHIFT, J, resizeactive, 0 40
binde = $mainMod SHIFT, J, resizeactive, 0 40

# Special workspaces (Spotify)
unbind = $mainMod, M, togglespecialworkspace, Music
bind = $mainMod, M, togglespecialworkspace, Music


# Special workspaces (apps)
unbind = $mainMod, R, togglespecialworkspace, Apps
bind = $mainMod, R, togglespecialworkspace, Apps


# Special workspaces (scratchpad)
