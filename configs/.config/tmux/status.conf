# Status bar. Sourced after tpm so catppuccin's @thm_* colours and module helper exist.
set -g status-left-length 100
set -g status-right-length 150

# ── Bar and popups: clear colours the old theme left behind on reload; popups stay transparent ──
set -gF status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-status-style default
set -g window-status-current-style default
set -g popup-style default
set -gF popup-border-style "fg=#{@thm_surface_1}"

# ── Tab contents: program icon, folder (or the manual name), pane count, Claude Code state ──
# @claude_state is set per pane by ~/.claude/hooks/tmux-claude-state.sh; the tab counts panes per state
set -g @claude_working_count "#{n:#{P:#{?#{==:#{@claude_state},working},x,}}}"
set -g @claude_waiting_count "#{n:#{P:#{?#{==:#{@claude_state},waiting},x,}}}"
set -g @claude_done_count "#{n:#{P:#{?#{==:#{@claude_state},done},x,}}}"
set -g @claude_marker "\
#{?#{!=:#{E:@claude_working_count},0}, #[fg=#{@thm_yellow}]󰔟#{?#{>:#{E:@claude_working_count},1}, #{E:@claude_working_count},}#[fg=#{@thm_fg}],}\
#{?#{!=:#{E:@claude_waiting_count},0}, #[fg=#{@thm_red}]#{?#{>:#{E:@claude_waiting_count},1}, #{E:@claude_waiting_count},}#[fg=#{@thm_fg}],}\
#{?#{!=:#{E:@claude_done_count},0}, #[fg=#{@thm_green}]#{?#{>:#{E:@claude_done_count},1}, #{E:@claude_done_count},}#[fg=#{@thm_fg}],}"
# Hint for Alt+a: Claude panes it would visit (waiting or done, any session, not the window you are in),
# named after the pane Alt+a jumps to next (claude-next --peek: same name as its tab and Alt+o row).
# Red pill while any is waiting, green when only finished ones are left; hidden when none.
# Counting: each pane gives 1/0 from #{==:…}, zeros are stripped, the length is the count. (A #{?…,x,}
# inside another conditional's branch expands to nothing, so no inner conditional here.)
set -g @claude_attention_waiting_count "#{n:#{s/0//:#{S:#{W:#{?#{&&:#{==:#{session_name},#{client_session}},#{window_active}},,#{P:#{==:#{@claude_state},waiting}}}}}}}"
set -g @claude_attention_done_count "#{n:#{s/0//:#{S:#{W:#{?#{&&:#{==:#{session_name},#{client_session}},#{window_active}},,#{P:#{==:#{@claude_state},done}}}}}}}"
set -g @claude_attention_colour "#{?#{!=:#{E:@claude_attention_waiting_count},0},#{@thm_red},#{@thm_green}}"
set -g @claude_attention_badge "#{?#{||:#{!=:#{E:@claude_attention_waiting_count},0},#{!=:#{E:@claude_attention_done_count},0}},\
#[fg=#{E:@claude_attention_colour}#,bg=#{@thm_bg}]#[fg=#{@thm_crust}#,bg=#{E:@claude_attention_colour}]󶀀 \
#{?#{!=:#{E:@claude_attention_waiting_count},0},#{E:@claude_attention_waiting_count} waiting,}\
#{?#{&&:#{!=:#{E:@claude_attention_waiting_count},0},#{!=:#{E:@claude_attention_done_count},0}}, · ,}\
#{?#{!=:#{E:@claude_attention_done_count},0},#{E:@claude_attention_done_count} done,}\
  #[bold]#(~/.config/tmux/scripts/claude-next --peek '#{pane_id}')#[nobold]#[fg=#{E:@claude_attention_colour}#,bg=#{@thm_bg}] ,}"
# Claude Code sets the pane title to a generated task name after the first prompt ("✳ Fix login redirect");
# Claude windows show it (status glyph stripped), cut at a word boundary to at most 20 chars, no ellipsis:
# longer titles keep their first 21 chars minus the last partial word. Before the first prompt, or when
# renamed by hand, the folder / #W stays. (No {m,n} regex quantifiers here: braces break tmux formats.)
set -g @claude_title_full "#{s/^[^ ]+ //:pane_title}"
set -g @claude_tab_title "#{=20:#{?#{e|>:#{n:#{E:@claude_title_full}},20},#{s/ [^ ]*$//:#{=21:#{E:@claude_title_full}}},#{E:@claude_title_full}}}"
set -g @claude_has_title "#{&&:#{==:#{pane_current_command},claude},#{!=:#{E:@claude_title_full},Claude Code}}"
set -g @window_label "\
#(~/.config/tmux/scripts/window-icon '#{pane_current_command}') #{?#{automatic-rename},#{?#{E:@claude_has_title},#{E:@claude_tab_title},#{b:pane_current_path}},#W}\
#{?#{>:#{window_panes},1},#{?window_zoomed_flag, #[fg=#{@thm_peach}]󰁌 #{window_panes}#[fg=default], 󰕰 #{window_panes}},}\
#{E:@claude_marker}"
set-hook -g 'session-window-changed[10]' "run-shell -b '~/.config/tmux/scripts/claude-clear-done #{window_id}'"
set-hook -g 'client-session-changed[10]' "run-shell -b '~/.config/tmux/scripts/claude-clear-done #{window_id}'"
set-hook -g 'client-session-changed[20]' "run-shell -b \"~/.config/tmux/scripts/session-history record '#{session_id}'\""
set-hook -g 'session-closed[20]' "run-shell -b '~/.config/tmux/scripts/session-history refresh'"

# ── Background window alerts: catppuccin shows the bell/activity icons on tabs ──
set -g monitor-activity on
set -g monitor-bell on
set -g visual-activity off
set -g visual-bell off
set -g activity-action other
set -g bell-action other
set -g window-status-activity-style default
set -g window-status-bell-style default

# ── Custom modules (one file each: %hidden vars are file-scoped at parse time) ──
source-file ~/.config/tmux/modules/git.conf

# ── Left: mode badges (copy, sync); zoom lives in the window tab ──
set -g status-left "\
#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow}]#[fg=#{@thm_crust}#,bg=#{@thm_yellow}#,bold]COPY#[fg=#{@thm_yellow}#,bg=#{@thm_bg}#,nobold] ,}\
#{?pane_synchronized,#[fg=#{@thm_red}]#[fg=#{@thm_crust}#,bg=#{@thm_red}#,bold]SYNC#[fg=#{@thm_red}#,bg=#{@thm_bg}#,nobold] ,}"

# ── Right: Alt+a hint (Claude panes needing you), git branch, session (+ other session count) ──
set -g status-right "\
#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)\
#{E:@claude_attention_badge}\
#{?#{!=:#(~/.config/tmux/scripts/git-branch-segment '#{pane_current_path}'),},#{E:@catppuccin_status_git},}\
#{E:@catppuccin_status_session}"


# ── No top line: the Alt+Tab target is not shown anywhere ──
set -g pane-border-status off
