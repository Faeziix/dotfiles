# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.1'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'christoomey/vim-tmux-navigator'

# text pickers (comparing the two)
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'laktak/extrakto'

# Remove conflicting terminal type declaration
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ',*:RGB'
set-option -ga terminal-overrides ',xterm-256color:Tc'

set -g status-justify left

set-option -ga terminal-features ",xterm-kitty:usstyle"
set-option -ga terminal-features ",alacritty:usstyle"
set-option -ga terminal-features ",kitty:usstyle"
# set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

bind-key T swap-window -t 1

# quality of life
set -g mouse on
set -sg escape-time 10
set -g history-limit 50000
# set -g focus-events on
# set -g set-clipboard on
set -g display-time 2000
set -g detach-on-destroy off

# vim binding
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
# clipboard handled by tmux-yank (Wayland-aware via wl-copy)

# vim-like window navigation
bind -r ^ last-window
# bind -r k select-pane -U
# bind -r j select-pane -D
# bind -n C-S-j previous-window
# bind -n C-S-k next-window
# bind -r h select-pane -L
# bind -r l select-pane -R

# set prefix to Alt + Space
unbind C-b
set-option -g prefix M-Space

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Alt+Tab jumps back to the previous session (niri's Alt+Tab removed so it reaches tmux)
bind -N "Previous session (queue)" -n M-Tab run-shell "~/.config/tmux/scripts/session-history previous"

# ── One-key layer: hold Alt, no prefix ──
bind -N "Window 1"           -n M-1     select-window -t :1
bind -N "Window 2"           -n M-2     select-window -t :2
bind -N "Window 3"           -n M-3     select-window -t :3
bind -N "Window 4"           -n M-4     select-window -t :4
bind -N "Window 5"           -n M-5     select-window -t :5
bind -N "Window 6"           -n M-6     select-window -t :6
bind -N "Window 7"           -n M-7     select-window -t :7
bind -N "Window 8"           -n M-8     select-window -t :8
bind -N "Window 9"           -n M-9     select-window -t :9
bind -N "Resize left"        -n M-H     resize-pane -L 5
bind -N "Resize down"        -n M-J     resize-pane -D 5
bind -N "Resize up"          -n M-K     resize-pane -U 5
bind -N "Resize right"       -n M-L     resize-pane -R 5
bind -N "Zoom pane"          -n M-z     resize-pane -Z
bind -N "Next window"        -n M-.     next-window
bind -N "Previous window"    -n M-,     previous-window
bind -N "Move window right"  -n M->     swap-window -d -t +1
bind -N "Move window left"   -n M-<     swap-window -d -t -1
bind -N "New window here"    -n M-w     new-window -c "#{pane_current_path}"
bind -N "New Claude window here (skips permissions)" -n M-W new-window -c "#{pane_current_path}" \; send-keys "claude --dangerously-skip-permissions" Enter
bind -N "Split below"        -n M-b     split-window -v -c "#{pane_current_path}"
bind -N "Close pane (asks only if something is running)" -n M-x \
  if-shell "case '#{pane_current_command}' in zsh|bash|sh|dash|fish) pgrep -P #{pane_pid} >/dev/null ;; *) true ;; esac" \
    "confirm-before -p \"Kill #{pane_current_command} in pane #P? (y/n)\" kill-pane" \
    "kill-pane"
bind -N "Close pane (asks only if something is running)" x \
  if-shell "case '#{pane_current_command}' in zsh|bash|sh|dash|fish) pgrep -P #{pane_pid} >/dev/null ;; *) true ;; esac" \
    "confirm-before -p \"Kill #{pane_current_command} in pane #P? (y/n)\" kill-pane" \
    "kill-pane"
bind -N "Pick session"       -n M-s     set -gF @picker_origin_session "#{session_id}" \; display-popup -E -b rounded -T "#[align=centre] sessions " -w 85% -h 70% ~/.config/tmux/scripts/session-picker
bind -N "Floating shell"     -n M-g     display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
bind -N "Files (yazi)"       -n M-y     split-window -h -Z -c "#{pane_current_path}" yazi
bind -N "Projects (leap)"    -n M-f     set -gF @picker_origin_session "#{session_id}" \; display-popup -E -b rounded -T "#[align=centre] projects " -w 70% -h 70% -d "#{pane_current_path}" ~/.config/tmux/scripts/project-picker
bind -N "Next Claude that needs you" -n M-a run-shell "~/.config/tmux/scripts/claude-next '#{pane_id}' '#{client_name}'"
bind -N "Claude dashboard"   -n M-o     set -gF @picker_origin_client "#{client_name}" \; display-popup -E -b rounded -T "#[align=centre] claude " -w 70% -h 70% ~/.config/tmux/scripts/claude-dashboard

# ── Prefix layer: Alt+Space, then key ──
bind -N "Last window"        M-Space last-window
bind -N "Reload config"      r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind -N "New session"        S command-prompt -p "New session:" "new-session -A -s '%%'"
bind -N "Rename session"     R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Rename Claude tab (suggests a name from the latest prompts)" N run-shell -b "~/.config/tmux/scripts/claude-rename-tab '#{pane_id}' '#{client_name}'"
bind -N "Kill session"       X confirm-before -p "Kill session #S? (y/n)" kill-session
bind -N "Kill window"        q confirm-before -p "Kill window #W? (y/n)" kill-window
bind -N "Clear screen"       C-l send-keys C-l
bind -N "Command menu"       Enter display-menu -T "#[align=centre] tmux " -x C -y C \
  "Split right"    "%" "split-window -h -c '#{pane_current_path}'" \
  "Split below"    "\"" "split-window -v -c '#{pane_current_path}'" \
  "Zoom pane"      z   "resize-pane -Z" \
  "" \
  "New window"     w   "new-window -c '#{pane_current_path}'" \
  "Rename window"  ,   "command-prompt -I '#W' \"rename-window -- '%%'\"" \
  "Kill window"    q   "kill-window" \
  "" \
  "Pick session"   s   "set -gF @picker_origin_session '#{session_id}' ; display-popup -E -b rounded -w 85% -h 70% ~/.config/tmux/scripts/session-picker" \
  "New session"    S   "command-prompt -p 'New session:' \"new-session -A -s '%%'\"" \
  "Rename session" R   "command-prompt -I '#S' \"rename-session -- '%%'\"" \
  "" \
  "Reload config"  r   "source-file ~/.config/tmux/tmux.conf"

# ── Copy mode (vi) ──
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# continuum

set -g @continuum-restore 'on'

# tmux-thumbs  ->  prefix + F   (fast Rust hint-picker; type the hint letter)
set -g @thumbs-key F
set -g @thumbs-unique enabled
set -g @thumbs-reverse enabled
set -g @thumbs-command 'wl-copy -- {}'
set -g @thumbs-upcase-command 'wl-copy -- {} && tmux paste-buffer'

# extrakto    ->  prefix + Tab  (fzf fuzzy-filter over screen text)
set -g @extrakto_key tab
set -g @extrakto_clip_tool 'wl-copy'
set -g @extrakto_split_direction 'p'


# Theme options must be set before catppuccin loads
source-file ~/.config/tmux/theme.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Status bar overrides catppuccin, so it must load after tpm
source-file ~/.config/tmux/status.conf
